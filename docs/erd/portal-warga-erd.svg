<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Portal Warga ERD</title><desc id="desc">Ringkasan entity relationship diagram berdasarkan migration Laravel aktual.</desc>
<style>.box{fill:#f8fafc;stroke:#0f766e;stroke-width:2}.t{font:700 16px sans-serif;fill:#0f172a}.f{font:13px monospace;fill:#334155}.l{stroke:#64748b;stroke-width:2;fill:none}.note{font:13px sans-serif;fill:#475569}</style>
<rect width="1200" height="760" fill="white"/>
<g class="l"><path d="M210 120H310"/><path d="M490 120H590"/><path d="M770 120H870"/><path d="M680 180V250"/><path d="M770 310H870"/><path d="M960 370V450"/><path d="M770 510H870"/><path d="M590 510H490"/><path d="M310 510H210"/><path d="M120 570V640"/><path d="M400 570V640"/><path d="M680 570V640"/></g>
<g transform="translate(30 60)"><rect class="box" width="180" height="120"/><text class="t" x="12" y="25">USERS</text><text class="f" x="12" y="50">id PK</text><text class="f" x="12" y="70">email UK</text><text class="f" x="12" y="90">password</text></g>
